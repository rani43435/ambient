<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; }
  button { position: relative; width: 44px; height: 44px; margin: 4px; border-radius: 50%; border: 0;
    background: rgba(14,15,19,.78); color: #F2F2EF; cursor: pointer; display: flex; align-items: center; justify-content: center;
    opacity: .5; transition: opacity .25s, transform .2s, box-shadow .25s; padding: 0; box-shadow: inset 0 1px 0 rgba(255,255,255,.08); }
  button::before { content: ""; position: absolute; inset: 0; border-radius: 50%; padding: 1px; pointer-events: none;
    background: linear-gradient(135deg, rgba(127,227,176,.7), rgba(255,255,255,.08) 45%, rgba(124,156,255,.65));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }
  button:hover, button:focus-visible { opacity: 1; transform: scale(1.05); outline: none; box-shadow: 0 0 18px rgba(127,227,176,.35), inset 0 1px 0 rgba(255,255,255,.08); }
  button:active { transform: scale(.96); }
  svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
</style></head>
<body>
  <!-- Back to the app's home page -->
  <button id="b" title="Home (⌘⇧H)" aria-label="Home"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7"/><path d="M6 10v10h12V10"/></svg></button>
<script>
  const b = document.getElementById('b'); b.onclick = () => glow.home();
  if (!/Mac/.test(navigator.platform)) b.title = 'Home (Ctrl+Shift+H)';
</script>
</body></html>
