<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; }
  button { width: 44px; height: 44px; margin: 4px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.18);
    background: rgba(20,21,24,.72); color: #F2F2EF; cursor: pointer; display: flex; align-items: center; justify-content: center;
    opacity: .55; transition: opacity .2s, border-color .2s; padding: 0; }
  button:hover { opacity: 1; border-color: #7FE3B0; color: #7FE3B0; }
  svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
</style></head>
<body>
  <!-- Back to the app's home page -->
  <button id="b" title="Home (⌘⇧H)" aria-label="Home"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7"/><path d="M6 10v10h12V10"/></svg></button>
<script>document.getElementById('b').onclick = () => glow.home();</script>
</body></html>
